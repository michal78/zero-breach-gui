name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Set build version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/ZeroBreach.App/ZeroBreach.App.csproj -Raw
          $baseVersion = [version]$project.Project.PropertyGroup.Version
          $patch = $baseVersion.Build + [int]$env:GITHUB_RUN_NUMBER
          $version = '{0}.{1}.{2}' -f $baseVersion.Major, $baseVersion.Minor, $patch
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable executable and run tests
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Build-Portable.ps1 -Version $env:BUILD_VERSION

      - name: Write executable checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/ZeroBreach.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/SHA256SUMS.txt'), "$hash  ZeroBreach.exe`n", [Text.UTF8Encoding]::new($false))

      - name: Upload verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZeroBreach-win-x64-${{ steps.version.outputs.version }}
          path: |
            artifacts/ZeroBreach.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release from main
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ZeroBreach-win-x64-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            is_draft="$(jq -r .isDraft release-state.json)"
            if [[ "$is_draft" == "true" ]]; then
              actual_sha="$(jq -r .targetCommitish release-state.json)"
            else
              actual_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            fi
            if [[ "$actual_sha" != "$SOURCE_SHA" ]]; then
              echo "Release tag already belongs to another commit; refusing to overwrite it."
              exit 1
            fi
            if [[ "$is_draft" == "false" ]]; then
              mkdir existing
              gh release download "$tag" --pattern ZeroBreach.exe --pattern SHA256SUMS.txt --dir existing
              (cd existing && sha256sum --check SHA256SUMS.txt)
              cmp SHA256SUMS.txt existing/SHA256SUMS.txt
              echo "This release is already published with the same verified executable."
              exit 0
            fi
            gh release upload "$tag" ZeroBreach.exe SHA256SUMS.txt --clobber
          else
            gh release create "$tag" ZeroBreach.exe SHA256SUMS.txt \
              --target "$SOURCE_SHA" --title "Zero Breach $RELEASE_VERSION" \
              --generate-notes --draft
          fi
          latest=true
          current_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ -n "$current_tag" && "$(printf '%s\n%s\n' "$current_tag" "$tag" | sort -V | tail -n 1)" != "$tag" ]]; then
            latest=false
          fi
          gh release edit "$tag" --draft=false "--latest=$latest"
